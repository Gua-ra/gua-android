name: Enhancement request
description: Suggest an improvement to Gua for Android.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to propose an improvement. A change that affects every platform is discussed in the issue before any code is written.
  - type: textarea
    id: usecase
    attributes:
      label: Your use case
      description: Screenshots or mock-ups are welcome.
      placeholder: Tell us what you would like to do!
      value: |
        #### What would you like to do?

        #### Why would you like to do it?

        #### How would you like to achieve it?
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Have you considered any alternatives?
      placeholder: Other ways to solve the same problem.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      placeholder: Anything else you would like to add?
    validations:
      required: false
