name: Gua CI

# GUA FORK: single, self-contained pipeline for the fork.
#
# It deliberately does NOT depend on any upstream (element-hq) org secrets, LFS goldens,
# the enterprise submodule, Localazy, codecov, Diawi, Firebase, or Sonar — those upstream
# workflows are disabled to workflow_dispatch-only so the fork pipeline is green out of the box.
#
# Jobs: constraint guard -> build (assembleGplayDebug) + unit tests + lint/ktlint/detekt +
# Paparazzi screenshot verification. All on JDK 21 (the upstream default).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  # --- 1. Constraint guard: must pass before anything else builds. ----------
  constraints:
    name: Constraint guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need full history so the guard can scan commit messages for AI attribution.
          fetch-depth: 0
          persist-credentials: false
      - name: Run forbidden-content / secret guard
        run: ./tools/scripts/check-constraints.sh
        env:
          # On pull requests, scan commit messages only in base..HEAD. The fork's
          # branches descend from upstream element-x-android history, whose recent
          # commits carry Co-Authored-By trailers that the fork cannot rewrite, so a
          # full-history scan can never pass. check-constraints.sh documents
          # GUA_CONSTRAINTS_BASE_REF for exactly this. The tracked-file and keystore
          # scans are unaffected and still cover the whole tree. Push/dispatch runs
          # keep the full-history scan (empty value means unset to the script).
          GUA_CONSTRAINTS_BASE_REF: ${{ github.base_ref && format('origin/{0}', github.base_ref) || '' }}

  # --- 2. Build the primary fork artifact. ----------------------------------
  build:
    name: Assemble Gplay debug APK
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble Gplay debug APK
        run: ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-gplay-debug
          path: app/build/outputs/apk/gplay/debug/*-universal-debug.apk

  # --- 3. Unit tests + Paparazzi screenshot verification. -------------------
  #
  # Note: upstream goldens are stored in Git LFS and are NOT pulled here, so only the
  # Gua record-tests with real committed PNGs are meaningfully verified. verifyPaparazziDebug
  # still runs the whole suite; LFS-pointer goldens simply compare against their pointer files.
  tests:
    name: Unit tests + Paparazzi
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Run unit tests + screenshot verification
        run: ./gradlew testDebugUnitTest :tests:uitests:verifyPaparazziDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload test/screenshot failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-test-failures
          path: |
            **/build/paparazzi/failures/
            **/build/reports/tests/*UnitTest/

  # --- 4. Static analysis: lint, ktlint, detekt. ----------------------------
  quality:
    name: Lint / ktlint / detekt
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: ktlint
        run: ./gradlew ktlintCheck $CI_GRADLE_ARG_PROPERTIES
      - name: Android lint (gplay debug)
        run: ./gradlew :app:lintGplayDebug $CI_GRADLE_ARG_PROPERTIES --continue
      - name: detekt
        run: ./gradlew detekt $CI_GRADLE_ARG_PROPERTIES
      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-quality-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/
            **/build/reports/detekt/
