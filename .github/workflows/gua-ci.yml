name: Gua CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  constraints:
    name: Constraint guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need full history so the guard can scan commit messages for AI attribution.
          fetch-depth: 0
          persist-credentials: false
      # Scan only the commits this event adds: upstream history carries trailers the fork cannot rewrite.
      - name: Work out which commits this event adds
        id: scan_range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            # A new branch or a force push can leave `before` unresolvable.
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          if [ -z "$base" ]; then
            echo "::notice::No usable base for this event; skipping the commit-message scan."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Run forbidden-content / secret guard
        run: ./tools/scripts/check-constraints.sh
        env:
          GUA_CONSTRAINTS_BASE_REF: ${{ steps.scan_range.outputs.base }}
          GUA_CONSTRAINTS_SKIP_HISTORY: ${{ steps.scan_range.outputs.base == '' && '1' || '' }}

  build:
    name: Assemble Gplay debug APK
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble Gplay debug APK
        run: ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-gplay-debug
          path: app/build/outputs/apk/gplay/debug/*-universal-debug.apk

  tests:
    name: Unit tests + screenshots
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          # The :libraries:compound screenshot goldens are in Git LFS.
          lfs: true
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Run unit tests + screenshot verification
        run: ./gradlew testDebugUnitTest :tests:uitests:verifyPaparazziDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload test/screenshot failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-test-failures
          path: |
            **/build/paparazzi/failures/
            **/build/reports/tests/*UnitTest/

  quality:
    name: Lint / ktlint / detekt
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: ktlint
        run: ./gradlew ktlintCheck $CI_GRADLE_ARG_PROPERTIES --continue
      - name: Android lint (gplay debug)
        run: ./gradlew :app:lintGplayDebug $CI_GRADLE_ARG_PROPERTIES --continue
      - name: detekt
        run: ./gradlew detekt $CI_GRADLE_ARG_PROPERTIES --continue
      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-quality-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/
            **/build/reports/detekt/
