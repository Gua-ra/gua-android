name: Gua CI

# GUA FORK: single, self-contained pipeline for the fork.
#
# It deliberately does NOT depend on any upstream (element-hq) org secrets, LFS goldens,
# the enterprise submodule, Localazy, codecov, Diawi, Firebase, or Sonar — those upstream
# workflows are disabled to workflow_dispatch-only so the fork pipeline is green out of the box.
#
# Jobs: constraint guard -> build (assembleGplayDebug) + unit tests + lint/ktlint/detekt +
# Paparazzi screenshot verification. All on JDK 21 (the upstream default).

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, develop ]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-configuration-cache

jobs:
  # --- 1. Constraint guard: must pass before anything else builds. ----------
  constraints:
    name: Constraint guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Need full history so the guard can scan commit messages for AI attribution.
          fetch-depth: 0
          persist-credentials: false
      # The guard exists to stop NEW violations landing, so it only ever scans the commits an
      # event actually adds. A full-history scan can never pass: the fork descends from upstream
      # element-x-android, and the fork's own early history carries Co-Authored-By trailers that
      # cannot be rewritten now that branches are published. Scanning everything meant every push
      # to develop failed on commits that are already merged, which is what kept develop red.
      # The tracked-file and keystore scans are unaffected and still cover the whole tree.
      - name: Work out which commits this event adds
        id: scan_range
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/${BASE_REF}"
          elif [ -n "${BEFORE:-}" ] && ! printf '%s' "$BEFORE" | grep -qE '^0+$'; then
            # A brand new branch reports an all-zero "before", and a force push can leave it
            # pointing at a commit that is no longer reachable, so only trust it if git can
            # actually resolve it.
            if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          if [ -z "$base" ]; then
            # Nothing sensible to diff against (new branch, force push, manual dispatch). The
            # commit-message scan is skipped rather than falling back to the whole history,
            # which would fail on commits the pull request gate already cleared.
            echo "::notice::No usable base for this event; skipping the commit-message scan."
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Run forbidden-content / secret guard
        run: ./tools/scripts/check-constraints.sh
        env:
          GUA_CONSTRAINTS_BASE_REF: ${{ steps.scan_range.outputs.base }}
          GUA_CONSTRAINTS_SKIP_HISTORY: ${{ steps.scan_range.outputs.base == '' && '1' || '' }}

  # --- 2. Build the primary fork artifact. ----------------------------------
  build:
    name: Assemble Gplay debug APK
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Assemble Gplay debug APK
        run: ./gradlew :app:assembleGplayDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-gplay-debug
          path: app/build/outputs/apk/gplay/debug/*-universal-debug.apk

  # --- 3. Unit tests + screenshot verification. -----------------------------
  #
  # Two different screenshot tools run here. :tests:uitests uses Paparazzi against ~3100 plain
  # committed PNGs. :libraries:compound uses Roborazzi against 22 goldens that ARE in Git LFS,
  # which is why this job checks out with lfs: true. An earlier note here claimed pointer files
  # "simply compare against their pointer files" and are therefore harmless. They are not:
  # Roborazzi cannot decode a pointer and crashes on it.
  tests:
    name: Unit tests + screenshots
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
          # :libraries:compound's screenshot goldens are LFS-tracked (.gitattributes). Without this
          # they arrive as 130-byte pointer stubs, Roborazzi hands the pointer text to ImageIO,
          # gets null back, and throws NullPointerException while LOADING the golden, before any
          # pixel is compared. That is what the ten "screenshots FAILED" results in this job were:
          # not a rendering regression, just an unreadable file.
          lfs: true
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: Run unit tests + screenshot verification
        run: ./gradlew testDebugUnitTest :tests:uitests:verifyPaparazziDebug $CI_GRADLE_ARG_PROPERTIES
      - name: Upload test/screenshot failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-test-failures
          path: |
            **/build/paparazzi/failures/
            **/build/reports/tests/*UnitTest/

  # --- 4. Static analysis: lint, ktlint, detekt. ----------------------------
  quality:
    name: Lint / ktlint / detekt
    runs-on: ubuntu-latest
    needs: constraints
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}
      - name: ktlint
        # --continue so every offending module is reported in one run. Without it Gradle stops at
        # the first failing ktlint task, which made the job look like a single-file problem when
        # several modules were affected, and turned fixing lint into one round trip per module.
        run: ./gradlew ktlintCheck $CI_GRADLE_ARG_PROPERTIES --continue
      - name: Android lint (gplay debug)
        run: ./gradlew :app:lintGplayDebug $CI_GRADLE_ARG_PROPERTIES --continue
      - name: detekt
        # --continue for the same reason ktlint has it: without it Gradle stops at the
        # first failing module, so a fix just moves the failure to the next one. The
        # ktlint findings were fixed once already and detekt's were still hidden behind
        # two modules that happened to fail first.
        run: ./gradlew detekt $CI_GRADLE_ARG_PROPERTIES --continue
      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gua-quality-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/ktlint/
            **/build/reports/detekt/
