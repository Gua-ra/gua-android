name: Validate Git LFS

# GUA FORK: disabled — upstream LFS goldens are not pulled in the fork; only Gua record-tests carry
# real PNGs. Avoids false failures on LFS-pointer files. Manual only.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - uses: nschloe/action-cached-lfs-checkout@385a8ecc719e50b8c71af6ab01a624b486b7c3bc # v1.2.5

      - run: |
          ./tools/git/validate_lfs.sh
