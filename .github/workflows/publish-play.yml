name: Publish to Google Play

# GUA FORK: the app repo's version of the org-wide ci-cd.yml deploy paths, in order of how
# often they are used:
#   - label a PR `release-qa` -> builds that PR's branch and ships it to the QA app
#                               (global.gua.dev, "Gua QA") on the internal track, so a change can
#                               be installed from Play before it is merged. Pushing more commits
#                               with the label on re-ships it automatically.
#   - merge to main          -> stages a production publish that waits for an approver on the
#                               `production` environment. Nothing reaches Play until someone
#                               approves; `develop` merges never touch Play at all.
#   - workflow_dispatch      -> either path by hand from the Actions tab, with the app, track and
#                               status pickable, so nobody needs the gh CLI to cut a build.
#   - workflow_dispatch with firebase_version_code set (and app=prod)
#                            -> Firebase only: no build and no Play upload. The versionCode named is
#                               already on Play (any track, draft included) and publish-firebase-only
#                               hands exactly that build to the beta group, after the same `production`
#                               approval as any production action. The environment only lets `main`
#                               deploy, so dispatch it with --ref main.
#   Every successful production upload is followed by publish-firebase, which hands the same build
#   to the Android beta testers through Firebase App Distribution. That holds for a merge to main
#   and for every app=prod dispatch, to internal, alpha, beta or production alike: the Firebase group
#   is the beta channel, and it is meant to receive every production-signed upload. Only the QA app
#   never reaches it.
#
# This is a separate file from release.yml because release.yml is upstream's "give me unsigned
# artifacts on demand" workflow: it is dispatch-only by design, and adding PR/push triggers there
# would start ~35 minute gplay and fdroid builds on every pull request unless every job grew an
# `if:` guard. Keeping the fork's publishing here leaves release.yml diffable against element-hq
# and gives the deploy paths one file to review, the same way every service repo has one ci-cd.yml.

on:
  # main is the release branch; day-to-day work merges to develop, which is deliberately not a
  # trigger here.
  push:
    branches: ["main"]
  # `labeled` is what makes the release-qa label work: adding it re-runs this workflow.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      app:
        description: "Which app: qa (global.gua.dev, dev backend) or prod (global.gua, gua.global backend)"
        type: choice
        default: qa
        options: [qa, prod]
      track:
        description: "Play track to publish to"
        type: choice
        default: internal
        options: [internal, alpha, beta, production]
      status:
        description: "Release status on the track (draft uploads without rolling out)"
        type: choice
        default: draft
        options: [draft, inProgress, completed]
      firebase_version_code:
        description: "Firebase only: publish this versionCode, already on Play, to App Distribution. No build, no Play upload; needs app=prod; track and status are ignored"
        type: string
        default: ""

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g
  CI_GRADLE_ARG_PROPERTIES: --stacktrace --no-daemon -Dsonar.gradle.skipCompile=true --no-configuration-cache
  # Put this label on a PR to ship that PR's branch to the QA app. Only people with write access
  # can label, which is what keeps this from being an open door on a public repo.
  DEPLOY_LABEL: release-qa

jobs:
  # Cheap, secret-less job that decides what the event asked for. An unlabelled PR gets no further
  # than this: no release build, no keystore, no Play call. The PR's actual build and tests are
  # gua-ci.yml's job, so stopping here costs a pull request nothing. The decision itself lives in
  # scripts/publish-play-gate.sh so publish-play-gate.test.mjs can run it for every event shape;
  # at most one of qa, prod and firebase_only is ever true.
  gate:
    name: Decide what this event asks for
    runs-on: ubuntu-latest
    outputs:
      qa: ${{ steps.gate.outputs.qa }}
      prod: ${{ steps.gate.outputs.prod }}
      firebase_only: ${{ steps.gate.outputs.firebase_only }}
      firebase_version_code: ${{ steps.gate.outputs.firebase_version_code }}
      track: ${{ steps.gate.outputs.track }}
      status: ${{ steps.gate.outputs.status }}
    steps:
      # Only the scripts directory is checked out: the decision needs no source tree and no secret.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          sparse-checkout: .github/workflows/scripts
          persist-credentials: false
      - id: gate
        # Everything the decision reads comes in through env rather than being interpolated into
        # the script, so a branch or fork name can never be evaluated as shell.
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          IS_LABELLED: ${{ contains(github.event.pull_request.labels.*.name, env.DEPLOY_LABEL) }}
          INPUT_APP: ${{ inputs.app }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_STATUS: ${{ inputs.status }}
          INPUT_FIREBASE_VERSION_CODE: ${{ inputs.firebase_version_code }}
        run: bash .github/workflows/scripts/publish-play-gate.sh

  # QA app (global.gua.dev, "Gua QA", dev backend). Fires for a PR labelled `release-qa` and for a
  # dispatch with app=qa. Requires these repository secrets:
  #   GUA_RELEASE_KEYSTORE_BASE64  - base64 of the upload keystore (base64 -i gua-upload.jks | pbcopy)
  #   GUA_RELEASE_KEYSTORE_PASSWORD, GUA_RELEASE_KEY_ALIAS, GUA_RELEASE_KEY_PASSWORD
  #   PLAY_SERVICE_ACCOUNT_JSON    - a Play Console service-account JSON with "Release to testing tracks"
  #   GUA_DEV_LOCAL_PROPERTIES     - the gua.* dev-host lines normally kept in local.properties
  publish-qa:
    name: Publish QA to Google Play (${{ needs.gate.outputs.track }})
    needs: gate
    if: needs.gate.outputs.qa == 'true'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      # So a labelled PR can be told where it landed.
      pull-requests: write
    # A newer push to the same PR should supersede the build in flight; a 35 minute R8 build that
    # ships a superseded commit helps nobody.
    concurrency:
      group: publish-play-qa-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # Newly granted Play Console permissions take a while to propagate, and until they do the API
      # answers "The caller does not have permission". Check first so a run fails in a minute
      # instead of after a ~35 minute build. Opening an edit is the call an upload begins with.
      - name: Check Play API access
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: global.gua.dev
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "cryptography==46.0.3"
          python3 - <<'PY'
          import base64, json, os, sys, time, urllib.error, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          sa = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          pkg = os.environ["PACKAGE"]
          b64 = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=")

          now = int(time.time())
          claim = {"iss": sa["client_email"], "scope": "https://www.googleapis.com/auth/androidpublisher",
                   "aud": sa["token_uri"], "iat": now, "exp": now + 3600}
          signing_input = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + b"." + b64(json.dumps(claim).encode())
          key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
          assertion = (signing_input + b"." + b64(key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256()))).decode()

          body = urllib.parse.urlencode({"grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                                         "assertion": assertion}).encode()
          with urllib.request.urlopen(urllib.request.Request(sa["token_uri"], data=body)) as r:
              token = json.load(r)["access_token"]
          # This repo is PUBLIC, so run logs are world-readable and the service-account
          # address carries the GCP project id. Register it as a mask before anything else
          # prints (the Play API error body below quotes it back), while still naming which
          # account authenticated.
          print(f"::add-mask::{sa['client_email']}")
          print("authenticated as", sa["client_email"].split("@")[0], "(domain masked: public repo logs)")

          url = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}/edits"
          try:
              with urllib.request.urlopen(urllib.request.Request(
                      url, data=b"{}", method="POST",
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})) as r:
                  edit = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::Play API rejected the call for {pkg}: HTTP {e.code}")
              print(e.read().decode())
              if e.code in (401, 403):
                  print("::notice::Permissions are most likely still propagating. Retry later; do not widen the service account's access.")
              sys.exit(1)

          # Creating the edit is the actual permission check, so access is already proven by here.
          # Tidying the throwaway edit away is best-effort: v3 deletes an edit with DELETE on the
          # edit itself, and an edit that outlives this step expires by itself, so a failure to
          # clean up must never fail the publish.
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"{url}/{edit['id']}", method="DELETE", headers={"Authorization": f"Bearer {token}"}))
          except urllib.error.HTTPError as e:
              print(f"::warning::Could not discard the preflight edit ({e.code}); it will expire on its own.")
          print(f"::notice::Play API access to {pkg} confirmed; continuing to the build.")
          PY
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      # Build the PR's head commit, not the merge preview: what a tester installs should be the
      # branch as written, so a bug they hit is reproducible from that commit.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
      - name: Decode upload keystore
        env:
          GUA_RELEASE_KEYSTORE_BASE64: ${{ secrets.GUA_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$GUA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gua-upload.jks"
      # The QA app bakes the dev-deployment hosts, which live outside the public repo. Write the
      # same local.properties lines a dev machine has.
      - name: Inject dev deployment hosts
        env:
          GUA_DEV_LOCAL_PROPERTIES: ${{ secrets.GUA_DEV_LOCAL_PROPERTIES }}
        run: printf '%s\n' "$GUA_DEV_LOCAL_PROPERTIES" >> local.properties
      # gua.versionCodeOffset is what makes a label usable more than once: Play rejects a
      # versionCode it has already accepted, and the CalVer code in Versions.kt only moves when the
      # release script bumps it. The run number is unique and always increasing, so every QA upload
      # is accepted and they sort in the order they were built.
      - name: Build release-signed App Bundle (QA)
        env:
          GUA_RELEASE_KEYSTORE: ${{ runner.temp }}/gua-upload.jks
          GUA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GUA_RELEASE_KEYSTORE_PASSWORD }}
          GUA_RELEASE_KEY_ALIAS: ${{ secrets.GUA_RELEASE_KEY_ALIAS }}
          GUA_RELEASE_KEY_PASSWORD: ${{ secrets.GUA_RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew bundleGplayRelease
          -Pgua.deployment=dev
          -Pgua.versionCodeOffset=${{ github.run_number }}
          $CI_GRADLE_ARG_PROPERTIES
      # Pin to a commit SHA before relying on this in production.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: global.gua.dev
          releaseFiles: app/build/outputs/bundle/gplayRelease/app-gplay-release.aab
          track: ${{ needs.gate.outputs.track }}
          status: ${{ needs.gate.outputs.status }}
      - name: Firebase App Distribution
        run: echo "::notice::Skipped Firebase App Distribution. Beta testers get the production app only; the QA app ships through Play internal testing."
      - name: Tell the PR where it went
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Shipped to **Gua QA** (\`global.gua.dev\`), track \`${{ needs.gate.outputs.track }}\`, status \`${{ needs.gate.outputs.status }}\`, from commit \`${{ github.event.pull_request.head.sha }}\`.\n\nInternal testers get it once Play finishes processing. The QA app keeps this build until something else is shipped to it. Pushing more commits while the \`${{ env.DEPLOY_LABEL }}\` label is on rebuilds and supersedes this build.`
            })

  # Production app (global.gua, gua.global backend). APPROVAL GATE: fires on every merge to main
  # and on a dispatch with app=prod, then pauses until a maintainer approves the `production`
  # GitHub Environment (required reviewer: the deploy-approvers org team). This workflow only
  # references the environment; the reviewer rule is configured on the environment itself, so
  # nothing here can loosen it. Merging to main therefore cannot publish on its own.
  publish-prod:
    name: Publish Gua to Google Play (${{ needs.gate.outputs.track }})
    needs: gate
    if: needs.gate.outputs.prod == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Never cancel a prod publish that an approver has already waved through, and never let two
    # of them race for the same Play edit.
    concurrency:
      group: publish-play-prod
      cancel-in-progress: false
    outputs:
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      # Same fail-fast reason as the QA job: a permissions problem should surface in a minute, not
      # after an approver has waited out a ~35 minute build.
      - name: Check Play API access
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: global.gua
        run: |
          python3 -m pip install --quiet --disable-pip-version-check "cryptography==46.0.3"
          python3 - <<'PY'
          import base64, json, os, sys, time, urllib.error, urllib.parse, urllib.request
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import padding

          sa = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          pkg = os.environ["PACKAGE"]
          b64 = lambda d: base64.urlsafe_b64encode(d).rstrip(b"=")

          now = int(time.time())
          claim = {"iss": sa["client_email"], "scope": "https://www.googleapis.com/auth/androidpublisher",
                   "aud": sa["token_uri"], "iat": now, "exp": now + 3600}
          signing_input = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + b"." + b64(json.dumps(claim).encode())
          key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
          assertion = (signing_input + b"." + b64(key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256()))).decode()

          body = urllib.parse.urlencode({"grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
                                         "assertion": assertion}).encode()
          with urllib.request.urlopen(urllib.request.Request(sa["token_uri"], data=body)) as r:
              token = json.load(r)["access_token"]
          # This repo is PUBLIC, so run logs are world-readable and the service-account
          # address carries the GCP project id. Register it as a mask before anything else
          # prints (the Play API error body below quotes it back), while still naming which
          # account authenticated.
          print(f"::add-mask::{sa['client_email']}")
          print("authenticated as", sa["client_email"].split("@")[0], "(domain masked: public repo logs)")

          url = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}/edits"
          try:
              with urllib.request.urlopen(urllib.request.Request(
                      url, data=b"{}", method="POST",
                      headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"})) as r:
                  edit = json.load(r)
          except urllib.error.HTTPError as e:
              print(f"::error::Play API rejected the call for {pkg}: HTTP {e.code}")
              print(e.read().decode())
              if e.code in (401, 403):
                  print("::notice::Permissions are most likely still propagating. Retry later; do not widen the service account's access.")
              sys.exit(1)

          # Creating the edit is the actual permission check, so access is already proven by here.
          # Tidying the throwaway edit away is best-effort: v3 deletes an edit with DELETE on the
          # edit itself, and an edit that outlives this step expires by itself, so a failure to
          # clean up must never fail the publish.
          try:
              urllib.request.urlopen(urllib.request.Request(
                  f"{url}/{edit['id']}", method="DELETE", headers={"Authorization": f"Bearer {token}"}))
          except urllib.error.HTTPError as e:
              print(f"::warning::Could not discard the preflight edit ({e.code}); it will expire on its own.")
          print(f"::notice::Play API access to {pkg} confirmed; continuing to the build.")
          PY
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # The bundle's versionCode is Versions.VERSION_CODE (the CalVer constants in Versions.kt) times
      # 10, the bundle's ABI code being 0 (app/build.gradle.kts); a production build adds no offset.
      # publish-firebase asks Play for the APKs of exactly this versionCode.
      - name: Read the versionCode of this build
        id: version
        run: |
          set -euo pipefail
          read_const() { sed -n "s/^private const val $1 = //p" plugins/src/main/kotlin/Versions.kt; }
          year=$(read_const versionYear)
          month=$(read_const versionMonth)
          release=$(read_const versionReleaseNumber)
          for value in "$year" "$month" "$release"; do
            case "$value" in
              ''|*[!0-9]*)
                echo "::error::Could not read versionYear, versionMonth and versionReleaseNumber from plugins/src/main/kotlin/Versions.kt"
                exit 1 ;;
            esac
          done
          version_code=$(( ((2000 + year) * 10000 + month * 100 + release) * 10 ))
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "versionCode $version_code"
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60 # v6.1.1
      - name: Decode upload keystore
        env:
          GUA_RELEASE_KEYSTORE_BASE64: ${{ secrets.GUA_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$GUA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gua-upload.jks"
      # No versionCode offset and no dev hosts: a production build is exactly the CalVer version in
      # Versions.kt, pointing at gua.global. If Play rejects the versionCode as already used, the
      # release number in Versions.kt needs bumping; that is the intended signal, not a CI bug.
      - name: Build release-signed App Bundle (prod)
        env:
          GUA_RELEASE_KEYSTORE: ${{ runner.temp }}/gua-upload.jks
          GUA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GUA_RELEASE_KEYSTORE_PASSWORD }}
          GUA_RELEASE_KEY_ALIAS: ${{ secrets.GUA_RELEASE_KEY_ALIAS }}
          GUA_RELEASE_KEY_PASSWORD: ${{ secrets.GUA_RELEASE_KEY_PASSWORD }}
        run: ./gradlew bundleGplayRelease $CI_GRADLE_ARG_PROPERTIES
      # Pin to a commit SHA before relying on this in production.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@935ef9c68bb393a8e6116b1575626a7f5be3a7fb # v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: global.gua
          releaseFiles: app/build/outputs/bundle/gplayRelease/app-gplay-release.aab
          track: ${{ needs.gate.outputs.track }}
          status: ${{ needs.gate.outputs.status }}

  # Android beta testers get every production-signed upload through Firebase App Distribution: this
  # job follows every successful publish-prod, whether it went to production, internal, alpha or
  # beta, because the Firebase group is the beta channel. What they get is the universal APK Play
  # generated and signed for the versionCode publish-prod uploaded, so it is the approved build and
  # nothing is rebuilt; its signing certificate is checked against PLAY_SIGNING_CERT_SHA256 before it
  # is uploaded. Uploading the same bytes twice answers RELEASE_UNMODIFIED, so re-running this job
  # alone (after a Play processing delay or an IAM fix) is safe. Requires:
  #   secret GOOGLE_BETA_SA_JSON        - key of the beta-access service account, the same key
  #                                       gua-support-inbox uses; Play Console "View app information"
  #                                       on global.gua and roles/firebaseappdistro.admin on the
  #                                       Firebase project
  #   vars FIREBASE_PROJECT_NUMBER, FIREBASE_ANDROID_APP_ID (the global.gua app), FIREBASE_BETA_GROUP
  #        (group alias, default android-beta), PLAY_SIGNING_CERT_SHA256 (the Play app signing
  #        certificate, as shown in Play Console)
  # Details and one-time setup: docs/gua/RELEASE_PLAY.md.
  publish-firebase:
    name: Publish to Firebase App Distribution
    needs: [gate, publish-prod]
    if: needs.gate.outputs.prod == 'true' && needs.publish-prod.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      testing_uri: ${{ steps.firebase.outputs.testing_uri }}
      firebase_console_uri: ${{ steps.firebase.outputs.console_uri }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # keytool and apksigner run on this JDK; the runner's default JDK 17 cannot read Play's APKs.
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Publish to Firebase App Distribution
        id: firebase
        env:
          GOOGLE_BETA_SA_JSON: ${{ secrets.GOOGLE_BETA_SA_JSON }}
          PLAY_PACKAGE: global.gua
          VERSION_CODE: ${{ needs.publish-prod.outputs.version_code }}
          PLAY_SIGNING_CERT_SHA256: ${{ vars.PLAY_SIGNING_CERT_SHA256 }}
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_BETA_GROUP: ${{ vars.FIREBASE_BETA_GROUP || 'android-beta' }}
          RELEASE_NOTES_FILE: fastlane/metadata/android/en-US/changelogs/${{ needs.publish-prod.outputs.version_code }}.txt
          WORK_DIR: ${{ runner.temp }}
        run: node .github/workflows/scripts/publish-firebase-app-distribution.mjs

  # Firebase-only dispatch: `firebase_version_code` names a versionCode that is already on Play (any
  # track, draft included) and this job hands exactly that build to the beta group; nothing is built
  # and nothing is uploaded to Play. It is how the beta channel catches up with an upload that
  # publish-firebase did not follow (a run from before that job existed, or one whose Firebase step
  # cannot be re-run). Same script, same checks and same secret and variables as publish-firebase,
  # and the same `production` approval as publish-prod: what reaches the beta testers is a production
  # decision, and the environment's branch rule means the dispatch runs from main.
  publish-firebase-only:
    name: Publish Play versionCode ${{ needs.gate.outputs.firebase_version_code }} to Firebase App Distribution
    needs: gate
    if: needs.gate.outputs.firebase_only == 'true'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      testing_uri: ${{ steps.firebase.outputs.testing_uri }}
      firebase_console_uri: ${{ steps.firebase.outputs.console_uri }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: State the mode
        env:
          VERSION_CODE: ${{ needs.gate.outputs.firebase_version_code }}
        run: |
          echo "::notice::Firebase-only publish of global.gua versionCode $VERSION_CODE, already on Play: nothing is built and nothing is uploaded to Play."
          {
            echo "## Firebase-only publish"
            echo ""
            echo "Dispatched with \`firebase_version_code=$VERSION_CODE\`: the universal APK Play already holds for global.gua versionCode $VERSION_CODE goes to the beta group. Nothing was built and nothing was uploaded to Play."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Use JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Publish to Firebase App Distribution
        id: firebase
        env:
          GOOGLE_BETA_SA_JSON: ${{ secrets.GOOGLE_BETA_SA_JSON }}
          PLAY_PACKAGE: global.gua
          VERSION_CODE: ${{ needs.gate.outputs.firebase_version_code }}
          PLAY_SIGNING_CERT_SHA256: ${{ vars.PLAY_SIGNING_CERT_SHA256 }}
          FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_BETA_GROUP: ${{ vars.FIREBASE_BETA_GROUP || 'android-beta' }}
          RELEASE_NOTES_FILE: fastlane/metadata/android/en-US/changelogs/${{ needs.gate.outputs.firebase_version_code }}.txt
          WORK_DIR: ${{ runner.temp }}
        run: node .github/workflows/scripts/publish-firebase-app-distribution.mjs
