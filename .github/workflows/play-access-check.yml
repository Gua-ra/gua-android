name: Check Google Play API access

# GUA FORK: a ~30 second preflight for the publish pipeline. Newly granted Play Console
# permissions take a while to propagate, and until they do the Play API answers
# "The caller does not have permission" — which otherwise only surfaces at the END of a
# ~35 minute release build. This job authenticates as the service account and opens (then
# discards) an edit for the chosen app, which is exactly the call the upload starts with.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to check"
        type: choice
        default: qa
        options: [qa, prod]

permissions: {}

jobs:
  check:
    name: Check Play API access (${{ inputs.app }})
    runs-on: ubuntu-latest
    steps:
      - name: Open and discard a Play edit
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: ${{ inputs.app == 'qa' && 'global.gua.dev' || 'global.gua' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.parse, urllib.request
          import base64, hashlib, hmac

          sa = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          pkg = os.environ["PACKAGE"]

          # Sign a JWT assertion with the service account key, then exchange it for an access token.
          def b64(data: bytes) -> bytes:
              return base64.urlsafe_b64encode(data).rstrip(b"=")

          now = int(time.time())
          claim = {
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/androidpublisher",
              "aud": sa["token_uri"],
              "iat": now,
              "exp": now + 3600,
          }
          signing_input = b64(json.dumps({"alg": "RS256", "typ": "JWT"}).encode()) + b"." + b64(json.dumps(claim).encode())

          try:
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import padding
          except ImportError:
              os.system("pip install --quiet cryptography")
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import padding

          key = serialization.load_pem_private_key(sa["private_key"].encode(), password=None)
          signature = key.sign(signing_input, padding.PKCS1v15(), hashes.SHA256())
          assertion = (signing_input + b"." + b64(signature)).decode()

          body = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": assertion,
          }).encode()
          with urllib.request.urlopen(urllib.request.Request(sa["token_uri"], data=body)) as r:
              token = json.load(r)["access_token"]
          print("authenticated as", sa["client_email"])

          # edits.insert is the first call any upload makes, so it is the honest access probe.
          url = f"https://androidpublisher.googleapis.com/androidpublisher/v3/applications/{pkg}/edits"
          req = urllib.request.Request(url, data=b"{}", method="POST", headers={
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
          })
          try:
              with urllib.request.urlopen(req) as r:
                  edit = json.load(r)
          except urllib.error.HTTPError as e:
              detail = e.read().decode()
              print(f"::error::Play API rejected the call for {pkg}: HTTP {e.code}")
              print(detail)
              if e.code in (401, 403):
                  print("::notice::Permissions are most likely still propagating. Retry later; do not widen the service account's access.")
              sys.exit(1)

          # Leave no dangling edit behind.
          urllib.request.urlopen(urllib.request.Request(
              url + "/" + edit["id"] + ":delete", method="POST",
              headers={"Authorization": f"Bearer {token}"},
          ))
          print(f"::notice::Play API access to {pkg} is working. The publish workflow can upload.")
          PY
